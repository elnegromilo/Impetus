name: Compilar APK

# Compila la app, corre los tests y publica la APK en "Releases" cada vez que
# se sube algo a master. También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y probar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Resumir errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: impetus-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk impetus.apk
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version impetus.apk \
            --title "Impetus – última versión" \
            --notes "APK generada automáticamente desde el commit ${GITHUB_SHA::7}. Descarga impetus.apk desde tu celular e instálala." \
            --latest
